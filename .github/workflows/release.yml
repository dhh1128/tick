name: release

# Triggered by `scripts/release.py` pushing a `vX.Y.Z` tag. Builds the single-file
# `tick` zipapp and publishes it as a release asset, so the README's
# `releases/latest/download/tick` curl URL resolves.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify the tag matches pyproject version
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if tag != version:
              raise SystemExit(f"tag {tag!r} does not match pyproject version {version!r}")
          print(f"tag and version agree: {version}")
          PY

      - name: Build the zipapp
        run: python build.py dist/tick

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/tick --generate-notes
